<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asignaciones</title>
<style>
:root{--bg:#FCEFE2;--sur:#FFFAF5;--ink:#2B1810;--mut:#7A5A47;--line:#E7CDB5;--acc:#C2410C;--on:#FFFFFF;--hd:#1F2A44;--hdi:#FFFFFF;--bub:#FFE2C6;--bubi:#3A1F0E;--warn:#B42318;--sel:#FFE8D5;--gray:#8A8A8A;--wab:#128C4A;--wat:#FFFFFF;--wabd:#128C4A;color-scheme:light}
:root[data-theme="dark"]{--bg:#17110D;--sur:#211812;--ink:#F5E9DE;--mut:#B79C88;--line:#3A2A1F;--acc:#FB923C;--on:#1A0F08;--hd:#101626;--hdi:#FFFFFF;--bub:#5A3216;--bubi:#FFE9D6;--warn:#F87171;--sel:#3A2314;--gray:#BDBDBD;--wab:#211812;--wat:#25D366;--wabd:#3A2A1F;color-scheme:dark}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:Roboto,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--sur)}
header{background:var(--hd);color:var(--hdi);display:flex;align-items:center;gap:2px;padding:4px 6px 4px 16px;min-height:56px}
header h1{flex:1;font-size:20px;margin:0;font-weight:700}
header button{background:none;border:0;border-radius:50%;color:var(--hdi);width:44px;height:44px;min-height:0;padding:0;display:grid;place-items:center}
header button.on{background:rgba(255,255,255,.18)}
header svg{width:24px;height:24px}
header [data-a="back"]{font-size:24px;margin-left:-12px;margin-right:4px}
main{flex:1;overflow:auto;padding:14px 16px 20px}
nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--sur)}
nav button{border:0;border-top:3px solid transparent;border-radius:0;background:none;color:var(--mut);font-size:12px;padding:12px 0}
nav button.on{color:var(--acc);font-weight:700;border-top-color:var(--acc)}
button,input,textarea,select{font:inherit}
button{color:var(--ink);background:var(--sur);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,textarea,select{color:var(--ink);background:var(--sur);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%}
.pri{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:700;width:100%}
.dng{color:var(--warn)}
h2{font-size:15px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:8px}
label input,label textarea,label select{margin-top:4px;font-size:16px}
.info{background:var(--sel);border-left:4px solid var(--acc);border-radius:0 12px 12px 0;padding:10px 12px;margin-bottom:14px;font-size:14px}
.empty{color:var(--mut);margin:12px 0}
.warn{color:var(--warn);font-size:14px;margin:8px 0}
.cnt{color:var(--mut);font-size:13px;margin:4px 0 8px}
.leg{color:var(--mut);font-size:12.5px;margin:6px 2px 0;line-height:1.35}
.seg{display:grid;gap:4px;padding:4px;background:var(--bg);border-radius:14px;margin-bottom:14px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--bg);border-radius:14px}
.seg button,.seg3 button{border:0;background:transparent;padding:10px 4px}
.seg .on,.seg3 .on{background:var(--acc);color:var(--on);font-weight:700}
.ghost{color:var(--gray);display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 0 30px;text-align:center;font-size:15px}
.ghost svg{width:96px;height:96px}
.bub{background:var(--bub);color:var(--bubi);border-radius:18px 18px 18px 4px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.hd{font-weight:700;font-size:17px}
.slot small{display:block;font-weight:700;font-size:13px;opacity:.75}
.nms{display:flex;flex-wrap:wrap;gap:0 8px}
.nm{background:transparent;border:0;border-bottom:1px dashed currentColor;border-radius:0;color:inherit;font-size:17px;min-height:36px;padding:4px 0;text-align:left}
.nm:disabled{border-bottom-style:solid;opacity:1;cursor:default}
.nm.void{color:var(--warn);font-style:italic}
.cl{white-space:pre-line}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin:12px 0}
.stack{display:flex;flex-direction:column;gap:8px}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--wab);color:var(--wat);border-color:var(--wabd);font-weight:700}
.wa svg{width:22px;height:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:6px 12px;font-size:13px;border-radius:999px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:700}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.card .pri{margin-top:12px}
.tb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.tb button{display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.tb button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.tb svg{width:18px;height:18px;flex:none}
.menu{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.menu button{display:block;width:100%;text-align:left;border:0;border-radius:0;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}
.menu .on{background:var(--sel);color:var(--acc);font-weight:700}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;text-align:left}
.ph div{min-width:0}
.ph b{display:block;font-weight:600}
.ph small{display:block;color:var(--mut);font-size:12.5px}
.ph span{color:var(--warn);font-size:13px;flex:none}
.pp.off .ph b{color:var(--mut);text-decoration:line-through}
.pb{padding:10px 0 4px}
.dlist{position:relative}
.ditem{position:relative}
.ditem.drg{z-index:3;box-shadow:0 8px 22px rgba(0,0,0,.28);background:var(--sur);transition:none!important}
.hdl{display:grid;place-items:center;width:40px;height:44px;flex:none;color:var(--mut);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.hdl svg{width:22px;height:22px}
.rtop{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center}
.r2{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:8px}
.r2 label{margin:0}
.drow{display:grid;grid-template-columns:auto 1fr 84px auto;gap:6px;align-items:center;margin-bottom:8px}
.drow select{padding:10px 6px}
.r1{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.he{border-bottom:1px solid var(--line);padding:10px 0}
.he b{display:block;margin-bottom:4px}
.he div{font-size:14px;color:var(--mut)}
.line{display:flex;justify-content:space-between;align-items:center}
.card .line+.leg{margin-top:8px}
.sw{position:relative;width:52px;height:32px;min-height:0;padding:0;background:var(--bg);border:2px solid var(--line);border-radius:999px}
.sw i{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--mut)}
.sw.on{background:var(--acc);border-color:var(--acc)}
.sw.on i{left:22px;background:var(--on)}
.about{color:var(--mut);font-size:14px;line-height:1.7}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}
.ov.bt{align-items:flex-end;padding:0}
.dlg{background:var(--sur);border:2px solid var(--acc);border-radius:18px;padding:18px;max-width:340px;width:100%}
.dlg p{margin:0 0 4px}
.sheet{background:var(--sur);width:100%;max-width:520px;max-height:75%;overflow:auto;padding:16px;border-top:3px solid var(--acc);border-radius:20px 20px 0 0}
.sheet button{display:block;width:100%;text-align:left;margin-top:8px}
.sheet textarea{margin-top:8px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--sur);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90%;text-align:center}
.toast.on{opacity:1}
.wel{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;gap:18px;text-align:center}
.wel svg{width:96px;height:96px;border-radius:22px}
.wel h1{margin:0;font-size:28px}
.wel input,.wel .pri{max-width:320px}
.wel input{text-align:center}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const A = window.Android;
const clone = o => JSON.parse(JSON.stringify(o));
const K = 'asignaciones_app_v1';
const DEF = {
  roles: [
    {id:'pre', name:'Presidente', n:1, d:'all'},
    {id:'lib', name:'Lector del libro', n:1, d:'jue'},
    {id:'ata', name:'Lector de Atalaya', n:1, d:'sab'},
    {id:'pla', name:'Plataforma', n:1, d:'all'},
    {id:'son', name:'Sonido', n:1, d:'all'},
    {id:'ext', name:'Acomodador auditorio', n:2, d:'all'},
    {id:'int', name:'Acomodador exterior', n:2, d:'all'},
    {id:'mic', name:'Microfonista', n:2, d:'all'}
  ],
  days: [{id:'jue', name:'Jueves', wd:4}, {id:'sab', name:'Sábado', wd:6}],
  people: [], hist: [], last: {}, any: {},
  hdr: 'Asignaciones para hoy',
  cls: 'Si alguien no puede av\u00edseme y yo me encargo de buscar a otro, gracias \u{1F64B}\u200D\u2642\uFE0F',
  user: '', theme: 'sys', snd: true, hap: true, smart: false, day: '', sort: 'az', rem: [], v: 2
};
const ORDER = ['pre', 'lib', 'ata', 'pla', 'son', 'ext', 'int', 'mic'];
let S, saved;
try { saved = JSON.parse(localStorage.getItem(K)); } catch (e) { saved = null; }
const hasSaved = saved && typeof saved === 'object';
S = Object.assign(clone(DEF), hasSaved ? saved : {});
S.v = hasSaved ? (saved.v || 1) : 2;
function migrate() {
  if (!Array.isArray(S.days) || !S.days.length) S.days = clone(DEF.days);
  if (!Array.isArray(S.rem)) S.rem = [];
  if ((S.v || 1) < 2) {
    const i = S.roles.find(r => r.id === 'int');
    if (i && i.name === 'Acomodador interior') i.name = 'Acomodador exterior';
    const pos = r => { const k = ORDER.indexOf(r.id); return k < 0 ? 99 : k; };
    S.roles = S.roles.map((r, k) => ({r, k})).sort((a, b) => pos(a.r) - pos(b.r) || a.k - b.k).map(x => x.r);
    S.v = 2;
  }
}
migrate();
const save = () => { try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const rn = id => (S.roles.find(r => r.id === id) || {name:'?'}).name;
const pn = id => (S.people.find(p => p.id === id) || {name:'?'}).name;
const dayName = id => (S.days.find(d => d.id === id) || {name:''}).name;
const DN = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const TT = {msg:'Mensaje', ppl:'Personas', rol:'Roles', rem:'Avisos', his:'Historial'};
const SORTS = [['az','A-Z'], ['rec','Asignado recientemente'], ['old','Asignado hace mucho'], ['add','Agregado recientemente']];
const INFO = {
  msg:'Elegí el día, generá el mensaje y tocá un nombre para cambiarlo. Al copiar, enviar por WhatsApp o compartir, el mensaje queda registrado en el historial y los nombres cuentan como usados.',
  ppl:'Agregá una persona por línea y marcá qué roles puede cumplir. Tocá un nombre para editar sus roles o marcarlo como ausente. Usá Filtrar para ordenar y “Mostrar solo…” para ver quién cumple un rol.',
  rol:'Cada rol define cuántas personas lleva y en qué día se usa. Mantené apretado el ícono de tres barras y arrastralo para cambiar el orden en el mensaje. También podés editar el encabezado y la conclusión.',
  rem:'Elegí los días y la hora en que querés recibir el aviso. Si no llegan, permití las notificaciones y quitá la restricción de batería para esta app.',
  his:'Acá quedan los mensajes que se copiaron, enviaron o compartieron.',
  cfg:'Elegí el aspecto, los sonidos y la vibración. En Editar días cambiás los nombres, el día de la semana de cada uno y el orden (arrastrando las tres barras). Exportá una copia de seguridad en un archivo .txt.'
};
const ICON_I = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="7.8" r="1.4" fill="currentColor"/><path d="M12 11v6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>';
const ICON_G = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>';
const ICON_H = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>';
const ICON_F = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
const ICON_MSG = '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 10h44a5 5 0 0 1 5 5v27a5 5 0 0 1-5 5H31L19 57V47h-9a5 5 0 0 1-5-5V15a5 5 0 0 1 5-5z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M16 23h32M16 32h21" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';
const ICON_WA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.7 13.6L3 21l4.5-1.2A9 9 0 1 0 12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 7.8c-.4.5-.6 1.2-.3 2 .6 1.8 2.5 3.8 4.4 4.6.9.4 1.6.1 2.1-.4l.5-.7a.5.5 0 0 0-.1-.7l-1.5-1a.5.5 0 0 0-.7.1l-.5.6c-.9-.4-1.9-1.4-2.3-2.3l.6-.5a.5.5 0 0 0 .1-.7l-1-1.5a.5.5 0 0 0-.8 0z" fill="currentColor"/></svg>';
const LOGO = '<svg viewBox="0 0 96 96" aria-hidden="true"><rect width="96" height="96" fill="var(--acc)"/><path fill="#fff" d="M22 24h12v12H22zM42 28h32v4H42zM22 42h12v12H22zM42 46h32v4H42zM22 60h12v12H22zM42 64h20v4H42z"/></svg>';
const VER = (() => { try { return A ? A.version() : '1.1.0'; } catch (e) { return '1.1.0'; } })();

function pickDay() {
  if (S.smart) {
    const wd = ((new Date().getDay() + 6) % 7) + 1;
    const d = S.days.find(x => x.wd === wd);
    if (d) return d.id;
  }
  if (S.day && S.days.some(x => x.id === S.day)) return S.day;
  return S.days[0].id;
}
let tab = 'msg', cfg = false, info = false, draft = null, sent = false, open = null, sheet = null, dlg = null, nnv = '';
let menu = null, fRole = null, day = pickDay();
const add = new Set();

/* ---------- tema ---------- */
const mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : {matches:false};
function systemDark() { try { if (A) return A.isDark(); } catch (e) {} return mq.matches; }
function applyTheme() {
  const eff = S.theme === 'sys' ? (systemDark() ? 'dark' : 'light') : S.theme;
  const r = document.documentElement;
  r.setAttribute('data-theme', eff);
  try {
    if (A) {
      const cs = getComputedStyle(r);
      A.setBars(cs.getPropertyValue('--hd').trim(), cs.getPropertyValue('--sur').trim(), eff === 'light');
    }
  } catch (e) {}
}
if (mq.addEventListener) mq.addEventListener('change', applyTheme);

/* ---------- sonido y vibración táctil ---------- */
let ac;
function tone(f1, f2, d, v) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + d);
  } catch (e) {}
}
function tap(kind) {
  if (S.snd) { if (kind === 'ok') tone(900, 1500, .14, .08); else tone(1400, 700, .04, .08); }
  if (S.hap) { try { if (A) A.haptic(kind === 'ok' ? 1 : 0); } catch (e) {} }
}
document.addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('button,select,input,textarea,[data-a],.hdl')) tap();
}, true);

let tt;
function toast(m) {
  const t = $('#toast');
  t.textContent = m; t.classList.add('on');
  if (m.charAt(0) === '\u2713') tap('ok');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 3200);
}

/* ---------- lógica de asignaciones ---------- */
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function elig(r, used) {
  return shuffle(S.people)
    .filter(p => !p.off && p.r.includes(r.id) && !used.has(p.id))
    .sort((a, b) => (S.last[a.id + r.id] || 0) - (S.last[b.id + r.id] || 0) || (S.any[a.id] || 0) - (S.any[b.id] || 0));
}
function gen() {
  const rs = S.roles.filter(r => r.d === 'all' || r.d === day);
  const pool = r => S.people.filter(p => !p.off && p.r.includes(r.id)).length;
  const used = new Set(), res = {};
  [...rs].sort((a, b) => pool(a) - pool(b)).forEach(r => {
    res[r.id] = [];
    for (let i = 0; i < r.n; i++) {
      const c = elig(r, used)[0];
      if (c) used.add(c.id);
      res[r.id].push(c ? c.id : null);
    }
  });
  draft = rs.flatMap(r => res[r.id].map(p => ({r:r.id, p})));
  sent = false;
}
function groups() {
  const g = [];
  draft.forEach((s, i) => { let x = g.find(y => y.r === s.r); if (!x) { x = {r:s.r, ps:[]}; g.push(x); } x.ps.push({p:s.p, i}); });
  return g;
}
const txt = () => (S.hdr ? S.hdr + '\n\n' : '') + groups().map(g => rn(g.r) + '\n' + g.ps.map(x => x.p ? pn(x.p) : '(sin asignar)').join(', ')).join('\n\n') + (S.cls ? '\n\n' + S.cls : '');
function markSent() {
  if (!draft || sent) return false;
  const now = Date.now();
  draft.forEach(s => { if (s.p) { S.last[s.p + s.r] = now; S.any[s.p] = now; } });
  S.hist.push({t:now, day, dn:dayName(day), a:groups().map(g => [rn(g.r), g.ps.map(x => x.p ? pn(x.p) : 'Sin asignar').join(', ')])});
  S.day = day; sent = true; save();
  return true;
}
function afterSend(msg) {
  const n = markSent();
  toast('\u2713 ' + (msg ? msg + (n ? ' y registrado en el historial' : '') : (n ? 'Registrado en el historial' : 'Listo')));
}

/* ---------- arrastrar para reordenar (roles y días) ---------- */
let drag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest && e.target.closest('.hdl'); if (!h) return;
  const list = h.closest('.dlist'), el = h.closest('.ditem'), main = $('#main');
  const items = [...list.children].filter(x => x.classList.contains('ditem'));
  const i = items.indexOf(el);
  const tops = items.map(x => x.offsetTop), hs = items.map(x => x.offsetHeight);
  const gap = items.length > 1 ? tops[1] - (tops[0] + hs[0]) : 0;
  drag = {list, items, el, i, to:i, tops, hs, gap, main, kind:list.dataset.kind, y:e.clientY, y0:e.clientY + main.scrollTop};
  el.classList.add('drg');
  items.forEach(x => { if (x !== el) x.style.transition = 'transform .18s ease'; });
  try { h.setPointerCapture(e.pointerId); } catch (x) {}
  e.preventDefault();
  dragLoop();
}, {passive:false});
function dragUpdate() {
  const d = drag; if (!d) return;
  const dy = (d.y + d.main.scrollTop) - d.y0;
  d.el.style.transform = `translateY(${dy}px)`;
  const c = d.tops[d.i] + d.hs[d.i] / 2 + dy;
  let to = 0;
  d.items.forEach((x, k) => { if (k !== d.i && d.tops[k] + d.hs[k] / 2 < c) to++; });
  if (to !== d.to) { d.to = to; tap(); }
  const sh = d.hs[d.i] + d.gap;
  d.items.forEach((x, k) => {
    if (k === d.i) return;
    let t = 0;
    if (d.i < to && k > d.i && k <= to) t = -sh; else if (d.i > to && k < d.i && k >= to) t = sh;
    x.style.transform = t ? `translateY(${t}px)` : '';
  });
}
function dragLoop() {
  const d = drag; if (!d) return;
  const r = d.main.getBoundingClientRect();
  if (d.y < r.top + 70) d.main.scrollTop -= 10; else if (d.y > r.bottom - 70) d.main.scrollTop += 10;
  dragUpdate();
  requestAnimationFrame(dragLoop);
}
document.addEventListener('pointermove', e => { if (drag) { drag.y = e.clientY; e.preventDefault(); } }, {passive:false});
function dragEnd() {
  const d = drag; if (!d) return;
  drag = null;
  if (d.to === d.i) {
    d.el.classList.remove('drg');
    d.items.forEach(x => { x.style.transform = ''; x.style.transition = ''; });
    return;
  }
  let off = 0;
  if (d.to > d.i) for (let k = d.i + 1; k <= d.to; k++) off += d.hs[k] + d.gap;
  else for (let k = d.to; k < d.i; k++) off -= d.hs[k] + d.gap;
  d.el.classList.remove('drg');
  d.el.style.transition = 'transform .16s ease';
  d.el.style.transform = `translateY(${off}px)`;
  const arr = d.kind === 'roles' ? S.roles : S.days;
  const [m] = arr.splice(d.i, 1); arr.splice(d.to, 0, m);
  save(); draft = null; sent = false;
  setTimeout(render, 170);
}
document.addEventListener('pointerup', dragEnd);
document.addEventListener('pointercancel', dragEnd);

function copyText(s, cb) {
  const fb = () => {
    const t = document.createElement('textarea');
    t.value = s; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, s.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (x) {}
    t.remove();
    if (ok) cb(); else { sheet = {txt:s}; markSent(); render(); }
  };
  try { navigator.clipboard.writeText(s).then(cb, fb); } catch (x) { fb(); }
}
function doExport() {
  const n = new Date(), p = x => String(x).padStart(2, '0');
  const name = 'asignaciones-respaldo-' + n.getFullYear() + '-' + p(n.getMonth() + 1) + '-' + p(n.getDate()) + '_' + p(n.getHours()) + '-' + p(n.getMinutes()) + '.txt';
  const data = JSON.stringify(S);
  if (A) { A.saveFile(name, data); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type:'text/plain'})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  toast('\u2713 Respaldo exportado con éxito');
}
function importText(s) {
  try {
    const o = JSON.parse(s);
    if (!o || !Array.isArray(o.roles) || !Array.isArray(o.people) || !Array.isArray(o.hist)) throw 0;
    const keep = {user:S.user, theme:S.theme, snd:S.snd, hap:S.hap, smart:S.smart, rem:S.rem};
    S = Object.assign(clone(DEF), o);
    S.v = o.v || 1;
    Object.assign(S, {user:keep.user, theme:keep.theme, snd:keep.snd, hap:keep.hap, smart:keep.smart});
    S.rem = Array.isArray(o.rem) ? o.rem : keep.rem;
    migrate();
    draft = null; sent = false; day = pickDay(); save(); syncRem(); render();
    toast('\u2713 Respaldo cargado con éxito');
  } catch (x) { toast('El archivo no es una copia válida'); }
}

  }
  else if (a === 'rnew') { S.roles.push({id:uid(), name:'Rol nuevo', n:1, d:'all'}); save(); }
  else if (a === 'dnew') { S.days.push({id:uid(), name:'Día nuevo', wd:0}); save(); }
  else if (a === 'radd') { S.rem.push({id:uid(), days:[], time:''}); save(); }
  else if (a === 'rd') { const m = S.rem.find(x => x.id === id), d = +v; m.days = m.days.includes(d) ? m.days.filter(x => x !== d) : [...m.days, d]; save(); syncRem(); }
  else if (a === 'rx') { S.rem = S.rem.filter(x => x.id !== id); save(); syncRem(); }
  else if (a === 'batt') { try { A.batterySettings(); } catch (x) {} return; }
  else if (a === 'th') { S.theme = v; save(); applyTheme(); }
  else if (a === 'snd') { S.snd = !S.snd; save(); if (S.snd) tap('ok'); }
  else if (a === 'hap') { S.hap = !S.hap; save(); if (S.hap) tap('ok'); }
  else if (a === 'smart') { S.smart = !S.smart; save(); if (S.smart) day = pickDay(); }
  else if (a === 'exp') { doExport(); return; }
  else if (a === 'imp') { if (A) A.pickFile(); else $('#bf').click(); return; }
  render();
});
document.addEventListener('change', e => {
  const t = e.target, a = t.dataset.a; if (!a) return;
  if (a === 'bf') { const f = t.files && t.files[0]; t.value = ''; if (f) f.text().then(importText, () => toast('No se pudo leer el archivo')); return; }
  const r = S.roles.find(x => x.id === t.dataset.id), dd = S.days.find(x => x.id === t.dataset.id);
  if (a === 'rname' && r) r.name = t.value.trim() || r.name;
  else if (a === 'rcnt' && r) { r.n = Math.max(1, Math.min(9, +t.value || 1)); draft = null; }
  else if (a === 'rday' && r) { r.d = t.value; draft = null; }
  else if (a === 'dname' && dd) { dd.name = t.value.trim() || dd.name; t.value = dd.name; }
  else if (a === 'dwd' && dd) dd.wd = +t.value;
  else if (a === 'hdr') S.hdr = t.value.trim();
  else if (a === 'cls') S.cls = t.value.trim();
  else if (a === 'rtm') { const m = S.rem.find(x => x.id === t.dataset.id); if (m) { m.time = t.value; save(); syncRem(); render(); } return; }
  else if (a === 'user') {
    const n = t.value.trim();
    if (!n) { toast('El nombre no puede quedar vacío'); render(); return; }
    S.user = n; save(); syncRem(); toast('\u2713 Nombre guardado'); return;
  }
  save();
});

applyTheme();
render();
syncRem();
</script>
</body>
