<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asignaciones</title>
<style>
:root{--h:24;--s:92%;--al:40%;--ad:62%;
--acc:hsl(var(--h) var(--s) var(--al));--on:#FFFFFF;--hd:var(--acc);--hdi:#FFFFFF;
--bg:hsl(var(--h) 75% 95%);--sur:hsl(var(--h) 100% 99%);--ink:hsl(var(--h) 35% 11%);--mut:hsl(var(--h) 18% 38%);--line:hsl(var(--h) 45% 86%);
--bub:hsl(var(--h) 90% 90%);--bubi:hsl(var(--h) 55% 14%);--sel:hsl(var(--h) 90% 93%);--warn:#B42318;
--gray:#8A8A8A;--wab:#128C4A;--wat:#FFFFFF;--wabd:#128C4A;color-scheme:light}
:root[data-theme="dark"]{--acc:hsl(var(--h) var(--s) var(--ad));--on:hsl(var(--h) 60% 8%);--hd:hsl(var(--h) 62% 26%);
--bg:hsl(var(--h) 28% 8%);--sur:hsl(var(--h) 24% 11%);--ink:hsl(var(--h) 40% 93%);--mut:hsl(var(--h) 18% 70%);--line:hsl(var(--h) 22% 21%);
--bub:hsl(var(--h) 52% 22%);--bubi:hsl(var(--h) 90% 93%);--sel:hsl(var(--h) 40% 17%);--warn:#F87171;
--gray:#BDBDBD;--wab:hsl(var(--h) 24% 11%);--wat:#25D366;--wabd:hsl(var(--h) 22% 21%);color-scheme:dark}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:Roboto,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body,#app,header,nav,.card,.bub,.menu,.info,.dlg,.sheet,input,textarea,select{transition:background-color .35s,color .35s,border-color .35s}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--sur);overflow:hidden}
header{background:var(--hd);color:var(--hdi);display:flex;align-items:center;gap:2px;padding:4px 6px 4px 16px;min-height:56px}
header h1{flex:1;font-size:20px;margin:0;font-weight:700}
header button{background:none;border:0;border-radius:50%;color:var(--hdi);width:44px;height:44px;min-height:0;padding:0;display:grid;place-items:center;transition:background-color .25s,transform .14s}
header button.on{background:rgba(255,255,255,.22)}
header button:active{background:rgba(255,255,255,.3)}
header svg{width:24px;height:24px}
header [data-a="back"]{font-size:24px;margin-left:-12px;margin-right:4px}
main{flex:1;overflow:auto;padding:14px 16px 20px}
nav{position:relative;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--sur)}
nav button{border:0;border-radius:0;background:none;color:var(--mut);font-size:12px;padding:12px 0;transition:color .3s,background-color .2s}
nav button.on{color:var(--acc)}
nav button svg{width:26px;height:26px;display:block;margin:0 auto;transition:transform .32s cubic-bezier(.3,1.4,.5,1)}
nav button.on svg{transform:scale(1.14)}
nav button:active{transform:none;background:var(--sel)}
.ind{position:absolute;top:-1px;left:0;width:20%;height:3px;background:var(--acc);border-radius:0 0 3px 3px;transform:translateX(calc(var(--i) * 100%));transition:transform .34s cubic-bezier(.3,.8,.25,1),background-color .35s}
button,input,textarea,select{font:inherit}
button{color:var(--ink);background:var(--sur);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;cursor:pointer;transition:background-color .3s,color .3s,border-color .3s,transform .14s,box-shadow .3s}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,textarea,select{color:var(--ink);background:var(--sur);border:1px solid var(--line);border-radius:12px;padding:10px;width:100%;transition:background-color .35s,color .35s,border-color .25s,box-shadow .25s}
input:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--sel)}
.pri{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:700;width:100%}
.dng{color:var(--warn)}
h2{font-size:15px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:8px}
label input,label textarea,label select{margin-top:4px;font-size:16px}
.exp{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .3s cubic-bezier(.3,.8,.25,1),opacity .25s}
.exp.open{grid-template-rows:1fr;opacity:1}
.exp>.inner{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s .3s}
.exp.open>.inner{visibility:visible;transition-delay:0s}
.info{background:var(--sel);border-left:4px solid var(--acc);border-radius:0 12px 12px 0;padding:10px 12px;margin-bottom:14px;font-size:14px}
.empty{color:var(--mut);margin:12px 0}
.warn{color:var(--warn);font-size:14px;margin:8px 0}
.cnt{color:var(--mut);font-size:13px;margin:4px 0 8px}
.okn{animation:rise .35s cubic-bezier(.2,.7,.2,1) backwards}
.leg{color:var(--mut);font-size:12.5px;margin:6px 2px 0;line-height:1.35}
.seg{position:relative;display:grid;gap:4px;padding:4px;background:var(--bg);border-radius:14px;margin-bottom:14px}
.card .seg{margin-bottom:0}
.seg button{position:relative;z-index:1;border:0;background:transparent;padding:10px 4px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .28s,background-color .28s,transform .14s}
.seg button svg{width:22px;height:22px;display:block;margin:0 auto}
.seg.pl .on{color:var(--on)}
.seg:not(.pl) .on{background:var(--acc);color:var(--on)}
.pill{position:absolute;top:4px;bottom:4px;left:4px;background:var(--acc);border-radius:10px;z-index:0;transition:transform .34s cubic-bezier(.3,.8,.25,1),width .3s,background-color .35s}
.accs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.acc{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:4px 0;min-height:0;font-size:11.5px;color:var(--mut)}
.acc i{width:36px;height:36px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--sur),0 0 0 4px transparent;transition:box-shadow .3s,transform .3s cubic-bezier(.3,1.4,.5,1)}
.acc.on i{box-shadow:0 0 0 2px var(--sur),0 0 0 4px var(--c);transform:scale(1.1)}
.acc.on{color:var(--ink);font-weight:700}
.ghost{color:var(--gray);display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 0 30px;text-align:center;font-size:15px;animation:fade .4s}
.ghost svg{width:96px;height:96px}
.bub{background:var(--bub);color:var(--bubi);border-radius:18px 18px 18px 4px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.bub.fx-bub{animation:pop .38s cubic-bezier(.2,.9,.3,1.1) backwards}
.bub.fx-bub>*{animation:rise .42s cubic-bezier(.2,.7,.2,1) backwards}
.bub.fx-bub>:nth-child(2){animation-delay:.05s}.bub.fx-bub>:nth-child(3){animation-delay:.1s}.bub.fx-bub>:nth-child(4){animation-delay:.15s}
.bub.fx-bub>:nth-child(5){animation-delay:.2s}.bub.fx-bub>:nth-child(6){animation-delay:.25s}.bub.fx-bub>:nth-child(7){animation-delay:.3s}
.bub.fx-bub>:nth-child(n+8){animation-delay:.35s}
.hd{font-weight:700;font-size:17px}
.slot small{display:block;font-weight:700;font-size:13px;opacity:.75}
.nms{display:flex;flex-wrap:wrap;gap:0 8px}
.nm{background:transparent;border:0;border-bottom:1px dashed currentColor;border-radius:0;color:inherit;font-size:17px;min-height:36px;padding:4px 0;text-align:left}
.nm:disabled{border-bottom-style:solid;opacity:1;cursor:default}
.nm.void{color:var(--warn);font-style:italic}
.cl{white-space:pre-line}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin:12px 0}
.stack{display:flex;flex-direction:column;gap:8px}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--wab);color:var(--wat);border-color:var(--wabd);font-weight:700}
.wa svg{width:22px;height:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:6px 12px;font-size:13px;border-radius:999px;transition:background-color .32s,color .32s,border-color .32s,transform .14s}
.chip:active{background:var(--line);color:var(--mut);border-color:var(--line);transition-duration:.25s}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:700}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.card .pri{margin-top:12px}
.tb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.tb button{display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.tb button.on{border-color:var(--acc);color:var(--acc);font-weight:700;background:var(--sel)}
.tb svg{width:18px;height:18px;flex:none}
.menu{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.menu button{display:block;width:100%;text-align:left;border:0;border-radius:0;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}
.menu .on{background:var(--sel);color:var(--acc);font-weight:700}
.plist.fx-list>*{animation:rise .32s cubic-bezier(.2,.7,.2,1) backwards}
.plist.fx-list>:nth-child(2){animation-delay:.03s}.plist.fx-list>:nth-child(3){animation-delay:.06s}.plist.fx-list>:nth-child(4){animation-delay:.09s}
.plist.fx-list>:nth-child(5){animation-delay:.12s}.plist.fx-list>:nth-child(6){animation-delay:.15s}.plist.fx-list>:nth-child(n+7){animation-delay:.18s}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;text-align:left}
.ph:active{transform:none;background:var(--sel)}
.ph>div{min-width:0;flex:1}
.ph b{display:block;font-weight:600;transition:color .3s}
.ph small{display:block;color:var(--mut);font-size:12.5px}
.ph span{color:var(--warn);font-size:13px;flex:none}
.chev{width:20px;height:20px;flex:none;color:var(--mut);transition:transform .3s cubic-bezier(.3,.8,.25,1)}
.pp.open .chev{transform:rotate(180deg)}
.pp.off .ph b{color:var(--mut);text-decoration:line-through}
.pb{padding:10px 0 4px}
.dlist{position:relative}
.ditem{position:relative}
.ditem.drg{z-index:3;box-shadow:0 8px 22px rgba(0,0,0,.28);background:var(--sur);transition:none!important}
.hdl{display:grid;place-items:center;width:40px;height:44px;flex:none;color:var(--mut);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.hdl svg{width:22px;height:22px}
.rtop{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center}
.r2{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:8px}
.r2 label{margin:0}
.drow{display:grid;grid-template-columns:auto 1fr 84px auto;gap:6px;align-items:center;margin-bottom:8px}
.drow select{padding:10px 6px}
.r1{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.he{border-bottom:1px solid var(--line);padding:10px 0}
.hrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.he b{display:block}
.he .ln{font-size:14px;color:var(--mut)}
.trash{border:0;background:none;width:44px;height:44px;min-height:0;padding:0;margin:-6px -8px -6px 0;color:var(--warn);display:grid;place-items:center;border-radius:50%}
.trash:active{background:var(--sel)}
.trash svg{width:22px;height:22px}
.line{display:flex;justify-content:space-between;align-items:center}
.sw{position:relative;width:52px;height:32px;min-height:0;padding:0;background:var(--bg);border:2px solid var(--line);border-radius:999px}
.sw i{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--mut);transition:left .26s cubic-bezier(.3,.9,.4,1.1),background-color .26s}
.sw.on{background:var(--acc);border-color:var(--acc)}
.sw.on i{left:22px;background:var(--on)}
.about{color:var(--mut);font-size:14px;line-height:1.7}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:24px;z-index:5;animation:fade .2s}
.ov.bt{align-items:flex-end;padding:0}
.ov.out{animation:fadeout .17s forwards}
.dlg{background:var(--sur);border:2px solid var(--acc);border-radius:18px;padding:18px;max-width:340px;width:100%;animation:pop .26s cubic-bezier(.2,.9,.3,1.15)}
.dlg p{margin:0 0 4px}
.ov.out .dlg{animation:popout .17s forwards}
.sheet{background:var(--sur);width:100%;max-width:520px;max-height:75%;overflow:auto;padding:16px;border-top:3px solid var(--acc);border-radius:20px 20px 0 0;animation:up .3s cubic-bezier(.2,.8,.2,1)}
.ov.out .sheet{animation:down .17s forwards}
.sheet button{display:block;width:100%;text-align:left;margin-top:8px}
.sheet textarea{margin-top:8px}
.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,14px) scale(.96);background:var(--ink);color:var(--sur);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1.1);z-index:9;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.wel{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;gap:18px;text-align:center}
.wel svg{width:96px;height:96px;border-radius:22px;animation:pop .6s cubic-bezier(.2,.9,.3,1.2) backwards}
.wel>*:not(svg){animation:rise .55s cubic-bezier(.2,.7,.2,1) backwards}
.wel>:nth-child(2){animation-delay:.12s}.wel>:nth-child(3){animation-delay:.22s}.wel>:nth-child(4){animation-delay:.32s}
.wel h1{margin:0;font-size:28px}
.wel input,.wel .pri{max-width:320px}
.wel input{text-align:center}
main.fx-main>*{animation:rise .36s cubic-bezier(.2,.7,.2,1) backwards}
main.fx-main>:nth-child(2){animation-delay:.03s}main.fx-main>:nth-child(3){animation-delay:.06s}main.fx-main>:nth-child(4){animation-delay:.09s}
main.fx-main>:nth-child(5){animation-delay:.12s}main.fx-main>:nth-child(6){animation-delay:.15s}main.fx-main>:nth-child(7){animation-delay:.18s}
main.fx-main>:nth-child(n+8){animation-delay:.21s}
header h1.fx-title{animation:slidein .3s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
@keyframes popout{to{opacity:0;transform:scale(.92)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes slidein{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
:root[data-anim="off"] *,:root[data-anim="off"] *::before,:root[data-anim="off"] *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const A = window.Android;
const clone = o => JSON.parse(JSON.stringify(o));
const K = 'asignaciones_app_v1';
const DEF = {
  roles: [
    {id:'pre', name:'Presidente', n:1, d:'all'},
    {id:'lib', name:'Lector del libro', n:1, d:'jue'},
    {id:'ata', name:'Lector de Atalaya', n:1, d:'sab'},
    {id:'pla', name:'Plataforma', n:1, d:'all'},
    {id:'son', name:'Sonido', n:1, d:'all'},
    {id:'ext', name:'Acomodador auditorio', n:2, d:'all'},
    {id:'int', name:'Acomodador exterior', n:2, d:'all'},
    {id:'mic', name:'Microfonista', n:2, d:'all'}
  ],
  days: [{id:'jue', name:'Jueves', wd:4}, {id:'sab', name:'Sábado', wd:6}],
  people: [], hist: [], last: {}, any: {},
  hdr: 'Asignaciones para hoy',
  cls: 'Si alguien no puede av\u00edseme y yo me encargo de buscar a otro, gracias \u{1F64B}\u200D\u2642\uFE0F',
  user: '', theme: 'sys', accent: 'orange', anim: true, snd: true, hap: true, smart: false, day: '', sort: 'az', rem: [], v: 2
};
const ACC = {orange:[24,92,40,62,'Naranja'], blue:[217,90,46,66,'Azul'], sky:[199,95,36,60,'Celeste'], red:[2,78,46,66,'Rojo'], green:[145,75,28,52,'Verde']};
const ORDER = ['pre', 'lib', 'ata', 'pla', 'son', 'ext', 'int', 'mic'];
let S, saved;
try { saved = JSON.parse(localStorage.getItem(K)); } catch (e) { saved = null; }
const hasSaved = saved && typeof saved === 'object';
S = Object.assign(clone(DEF), hasSaved ? saved : {});
S.v = hasSaved ? (saved.v || 1) : 2;
function migrate() {
  if (!Array.isArray(S.days) || !S.days.length) S.days = clone(DEF.days);
  if (!Array.isArray(S.rem)) S.rem = [];
  if (!ACC[S.accent]) S.accent = 'orange';
  if ((S.v || 1) < 2) {
    const i = S.roles.find(r => r.id === 'int');
    if (i && i.name === 'Acomodador interior') i.name = 'Acomodador exterior';
    const pos = r => { const k = ORDER.indexOf(r.id); return k < 0 ? 99 : k; };
    S.roles = S.roles.map((r, k) => ({r, k})).sort((a, b) => pos(a.r) - pos(b.r) || a.k - b.k).map(x => x.r);
    S.v = 2;
  }
}
migrate();
const save = () => { try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const rn = id => (S.roles.find(r => r.id === id) || {name:'?'}).name;
const pn = id => (S.people.find(p => p.id === id) || {name:'?'}).name;
const dayName = id => (S.days.find(d => d.id === id) || {name:''}).name;
const DN = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const TT = {msg:'Mensaje', ppl:'Personas', rol:'Roles', rem:'Avisos', his:'Historial'};
const SORTS = [['az','A-Z'], ['rec','Asignado recientemente'], ['old','Asignado hace mucho'], ['add','Agregado recientemente']];
const INFO = {
  msg:'Elegí el día, generá el mensaje y tocá un nombre para cambiarlo. Al copiar, enviar por WhatsApp o compartir, el mensaje queda registrado en el historial y los nombres cuentan como usados.',
  ppl:'Agregá una persona por línea y marcá qué roles puede cumplir. Tocá un nombre para editar sus roles o marcarlo como ausente. Usá Filtrar para ordenar y “Mostrar solo…” para ver quién cumple un rol.',
  rol:'Cada rol define cuántas personas lleva y en qué día se usa. Mantené apretado el ícono de tres barras y arrastralo para cambiar el orden en el mensaje. También podés editar el encabezado y la conclusión.',
  rem:'Elegí los días y la hora en que querés recibir el aviso. Si no llegan, permití las notificaciones y quitá la restricción de batería para esta app.',
  his:'Acá quedan los mensajes que se copiaron, enviaron o compartieron. Tocá el cesto para borrar uno; borrarlo no cambia el orden de rotación.',
  cfg:'Elegí el aspecto, el color de la app, los sonidos y la vibración. En Editar días cambiás los nombres, el día de la semana de cada uno y el orden (arrastrando las tres barras). Exportá una copia de seguridad en un archivo .txt. En Restablecimiento podés borrar las personas, el historial o todos los datos; conviene exportar un respaldo antes.'

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function elig(r, used) {

    .sort((a, b) => (S.last[a.id + r.id] || 0) - (S.last[b.id + r.id] || 0) || (S.any[a.id] || 0) - (S.any[b.id] || 0));

function gen() {

  const used = new Set(), res = {}, now = Date.now(), w = {};
  /* Primero los roles con menos candidatos; a igualdad, primero el rol cuyo candidato lleva más tiempo esperando. */
  rs.forEach(r => { const c = elig(r, new Set())[0]; w[r.id] = c ? now - (S.last[c.id + r.id] || 0) : 0; });
  shuffle(rs).sort((a, b) => pool(a) - pool(b) || w[b.id] - w[a.id]).forEach(r => {
    res[r.id] = [];
    for (let i = 0; i < r.n; i++) {

/* ---------- render con "morph": conserva los elementos para poder animarlos ---------- */
const RT = ['fx-main', 'fx-bub', 'fx-title', 'fx-list'];
function syncClass(f, t) {
  const want = new Set((t.getAttribute('class') || '').split(/\s+/).filter(Boolean));
  RT.forEach(c => { if (f.classList.contains(c)) want.add(c); });
  [...f.classList].forEach(c => { if (!want.has(c)) f.classList.remove(c); });
  want.forEach(c => { if (!f.classList.contains(c)) f.classList.add(c); });
  if (!want.size && f.hasAttribute('class') && !f.getAttribute('class')) f.removeAttribute('class');
}
function morphEl(f, t) {
  [...f.attributes].forEach(a => { if (a.name !== 'class' && !t.hasAttribute(a.name)) f.removeAttribute(a.name); });
  [...t.attributes].forEach(a => {
    if (a.name === 'class') return;
    if (f.getAttribute(a.name) !== a.value) f.setAttribute(a.name, a.value);
  });
  syncClass(f, t);
  const tag = f.tagName;
  if (tag === 'TEXTAREA') { if (document.activeElement !== f && f.value !== t.textContent) f.value = t.textContent; return; }
  if (tag === 'INPUT') { if (f.type !== 'file' && document.activeElement !== f) { const v = t.getAttribute('value') || ''; if (f.value !== v) f.value = v; } return; }
  morphKids(f, t);
  if (tag === 'SELECT') f.value = t.value;
}
function morphKids(from, to) {
  const tk = [...to.childNodes], fk = from.childNodes;
  for (let i = 0; i < tk.length; i++) {
    const t = tk[i], f = fk[i];
    if (!f) { from.appendChild(t); continue; }
    if (f.nodeType !== t.nodeType || f.nodeName !== t.nodeName) { from.replaceChild(t, f); continue; }
    if (t.nodeType === 3) { if (f.nodeValue !== t.nodeValue) f.nodeValue = t.nodeValue; continue; }
    morphEl(f, t);
  }
  while (fk.length > tk.length) from.removeChild(from.lastChild);
}
function patch(html) {
  const tpl = document.createElement('div');
  tpl.innerHTML = html;
  morphKids($('#app'), tpl);
}
function re(sel, cls) {
  const el = document.querySelector(sel); if (!el) return;
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
}
const FXM = {main:['#main', 'fx-main'], bub:['.bub', 'fx-bub'], title:['header h1', 'fx-title'], list:['.plist', 'fx-list']};
function render() {
  if (!S.user) { patch(welcome()); return; }

  const view = cfg ? vCfg : {msg:vMsg, ppl:vPpl, rol:vRol, rem:vRem, his:vHis}[tab];
  patch(`<header>${cfg ? '<button data-a="back" aria-label="Volver">←</button>' : ''}<h1>${cfg ? 'Configuración' : TT[tab]}</h1><button data-a="info" class="${info ? 'on' : ''}" aria-label="Información">${ICON_I}</button><button data-a="cfg" class="${cfg ? 'on' : ''}" aria-label="Configuración">${ICON_G}</button></header><main id="main"><div class="exp ${info ? 'open' : ''}"><div class="inner"><div class="info">${INFO[cfg ? 'cfg' : tab]}</div></div></div>${view()}</main>${cfg ? '' : NAV()}${overlay()}`);
  if (resetScroll) { const m = $('#main'); if (m) m.scrollTop = 0; resetScroll = false; }
  fx.forEach(k => re(FXM[k][0], FXM[k][1])); fx = [];

/* ---------- arrastrar para reordenar (roles y días) ---------- */
let drag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest && e.target.closest('.hdl'); if (!h) return;
  const list = h.closest('.dlist'), el = h.closest('.ditem'), main = $('#main');
  const items = [...list.children].filter(x => x.classList.contains('ditem'));
  const i = items.indexOf(el);
  const tops = items.map(x => x.offsetTop), hs = items.map(x => x.offsetHeight);
  const gap = items.length > 1 ? tops[1] - (tops[0] + hs[0]) : 0;
  drag = {list, items, el, i, to:i, tops, hs, gap, main, kind:list.dataset.kind, y:e.clientY, y0:e.clientY + main.scrollTop};
  el.classList.add('drg');
  items.forEach(x => { if (x !== el) x.style.transition = 'transform .2s cubic-bezier(.3,.8,.25,1)'; });
  try { h.setPointerCapture(e.pointerId); } catch (x) {}
  e.preventDefault();
  dragLoop();
}, {passive:false});
function dragUpdate() {
  const d = drag; if (!d) return;
  const dy = (d.y + d.main.scrollTop) - d.y0;
  d.el.style.transform = `translateY(${dy}px)`;
  const c = d.tops[d.i] + d.hs[d.i] / 2 + dy;
  let to = 0;
  d.items.forEach((x, k) => { if (k !== d.i && d.tops[k] + d.hs[k] / 2 < c) to++; });
  if (to !== d.to) { d.to = to; tap(); }
  const sh = d.hs[d.i] + d.gap;
  d.items.forEach((x, k) => {
    if (k === d.i) return;
    let t = 0;
    if (d.i < to && k > d.i && k <= to) t = -sh; else if (d.i > to && k < d.i && k >= to) t = sh;
    x.style.transform = t ? `translateY(${t}px)` : '';
  });
}
function dragLoop() {
  const d = drag; if (!d) return;
  const r = d.main.getBoundingClientRect();
  if (d.y < r.top + 70) d.main.scrollTop -= 10; else if (d.y > r.bottom - 70) d.main.scrollTop += 10;
  dragUpdate();
  requestAnimationFrame(dragLoop);
}
document.addEventListener('pointermove', e => { if (drag) { drag.y = e.clientY; e.preventDefault(); } }, {passive:false});
function dragEnd() {
  const d = drag; if (!d) return;
  drag = null;
  if (d.to === d.i) {
    d.el.classList.remove('drg');
    d.items.forEach(x => { x.style.transform = ''; x.style.transition = ''; });
    return;
  }
  let off = 0;
  if (d.to > d.i) for (let k = d.i + 1; k <= d.to; k++) off += d.hs[k] + d.gap;
  else for (let k = d.to; k < d.i; k++) off -= d.hs[k] + d.gap;
  d.el.classList.remove('drg');
  d.el.style.transition = 'transform .18s cubic-bezier(.3,.8,.25,1)';
  d.el.style.transform = `translateY(${off}px)`;
  const arr = d.kind === 'roles' ? S.roles : S.days;
  const [m] = arr.splice(d.i, 1); arr.splice(d.to, 0, m);
  save(); draft = null; sent = false;
  setTimeout(render, S.anim === false ? 0 : 190);
}
document.addEventListener('pointerup', dragEnd);
document.addEventListener('pointercancel', dragEnd);

/* ---------- copiar, exportar, importar ---------- */
function copyText(s, cb) {
  const fb = () => {
    const t = document.createElement('textarea');
    t.value = s; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, s.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (x) {}
    t.remove();
    if (ok) cb(); else { sheet = {txt:s}; markSent(); render(); }
  };
  try { navigator.clipboard.writeText(s).then(cb, fb); } catch (x) { fb(); }
}
function doExport() {
  const n = new Date(), p = x => String(x).padStart(2, '0');
  const name = 'asignaciones-respaldo-' + n.getFullYear() + '-' + p(n.getMonth() + 1) + '-' + p(n.getDate()) + '_' + p(n.getHours()) + '-' + p(n.getMinutes()) + '.txt';
  const data = JSON.stringify(S);
  if (A) { A.saveFile(name, data); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type:'text/plain'})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  toast('\u2713 Respaldo exportado con éxito');
}
function importText(s) {
  try {
    const o = JSON.parse(s);
    if (!o || !Array.isArray(o.roles) || !Array.isArray(o.people) || !Array.isArray(o.hist)) throw 0;
    const keep = {user:S.user, theme:S.theme, accent:S.accent, anim:S.anim, snd:S.snd, hap:S.hap, smart:S.smart, rem:S.rem};
    S = Object.assign(clone(DEF), o);
    S.v = o.v || 1;
    Object.assign(S, {user:keep.user, theme:keep.theme, accent:keep.accent, anim:keep.anim, snd:keep.snd, hap:keep.hap, smart:keep.smart});
    S.rem = Array.isArray(o.rem) ? o.rem : keep.rem;
    migrate();
    draft = null; sent = false; day = pickDay(); save(); syncRem(); applyTheme(); render();
    toast('\u2713 Respaldo cargado con éxito');
  } catch (x) { toast('El archivo no es una copia válida'); }
}
function resetApp() {
  S = clone(DEF); S.v = 2;
  try { localStorage.removeItem(K); } catch (e) {}
  tab = 'msg'; cfg = false; info = false; open = null; menu = null; lastMenu = null; fRole = null;
  draft = null; sent = false; nnv = ''; add.clear(); dlg = null; sheet = null; day = pickDay();
  syncRem(); applyTheme();
}

  if (tab !== 'msg') { tab = 'msg'; fx = ['main', 'title']; resetScroll = true; render(); return true; }

};

    afterSend('');

  else if (a === 'addr') { add.has(b.dataset.r) ? add.delete(b.dataset.r) : add.add(b.dataset.r); }
  else if (a === 'addp') {
    const names = nnv.split('\n').map(x => x.trim()).filter(Boolean);

  else if (a === 'user') {
    const n = t.value.trim();
    if (!n) { toast('El nombre no puede quedar vacío'); render(); return; }
    S.user = n; save(); syncRem(); toast('\u2713 Nombre guardado'); return;
  }
  save();
});

applyTheme();
render();
syncRem();
</script>
</body>
